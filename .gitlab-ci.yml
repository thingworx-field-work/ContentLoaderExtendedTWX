image: gradle:jdk21

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  PACKAGE_NAME: "ContentLoaderExtended_Extension"
  # The ThingWorx SDK is not in git. It is downloaded from the generic package registry of
  # TWX_SDK_PROJECT_ID, from the package thingworx-sdk/TWX_SDK_VERSION. See the README.
  TWX_SDK_VERSION: "9.5.0-b143"
  TWX_SDK_PROJECT_ID: "$CI_PROJECT_ID"

cache:
  key:
    files:
      - build.gradle
      - gradle/wrapper/gradle-wrapper.properties
  paths:
    - .gradle/caches/
    - .gradle/wrapper/

stages:
  - pre
  - test
  - build
  - release

# Release tags look like release/2.2.0; the part after the slash is the package version
prepare_variables:
  stage: pre
  script:
    - PACKAGE_VERSION=${CI_COMMIT_TAG#*/}
    - echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> build.env
    - echo "PACKAGE_REGISTRY_URL=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/release/${PACKAGE_VERSION}" >> build.env
  artifacts:
    reports:
      dotenv: build.env

# This job will run semgrep on the codebase
semgrep:
  stage: test
  image: semgrep/semgrep
  script: semgrep ci
  variables:
    SEMGREP_APP_TOKEN: $SEMGREP_APP_TOKEN

# Compiles the code and tests the binaries, as part of the build process
compile:
  stage: build
  needs:
    - job: prepare_variables
  before_script:
    - |
      for jar in thingworx-common thingworx-platform-common; do
        curl --fail --show-error --silent --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --output "lib/twxSdk/${jar}-${TWX_SDK_VERSION}.jar" \
          "${CI_API_V4_URL}/projects/${TWX_SDK_PROJECT_ID}/packages/generic/thingworx-sdk/${TWX_SDK_VERSION}/${jar}-${TWX_SDK_VERSION}.jar"
      done
  script:
    - ./gradlew test
    - ./gradlew packageExtension
  artifacts:
    paths:
      - zip/*
    reports:
      junit: build/test-results/test/**/TEST-*.xml

# Uploads the built extension and creates the GitLab release.
release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: prepare_variables
      artifacts: true
    - job: compile
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^release\/.+/
  before_script:
    - apk add --no-cache curl
  script:
    # Fails when the tag does not match packageVersion in configfiles/metadata.xml
    - test -f "zip/${PACKAGE_NAME}-v${PACKAGE_VERSION}.zip" || { echo "zip/${PACKAGE_NAME}-v${PACKAGE_VERSION}.zip not found. Does the tag match packageVersion in metadata.xml?"; ls zip; exit 1; }
    - 'curl --fail --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "zip/${PACKAGE_NAME}-v${PACKAGE_VERSION}.zip" "${PACKAGE_REGISTRY_URL}/${PACKAGE_NAME}-v${PACKAGE_VERSION}.zip"'
  release:
    name: '$CI_COMMIT_TAG'
    tag_name: '$CI_COMMIT_TAG'
    description: 'Please fill out'
    assets:
      links:
        - name: '$PACKAGE_NAME-v$PACKAGE_VERSION.zip'
          url: '$PACKAGE_REGISTRY_URL/$PACKAGE_NAME-v$PACKAGE_VERSION.zip'
          filepath: '/binaries/$PACKAGE_NAME-v$PACKAGE_VERSION.zip'
          link_type: package
