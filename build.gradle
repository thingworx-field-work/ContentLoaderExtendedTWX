import groovy.xml.XmlParser
import groovy.xml.XmlUtil
import org.apache.http.client.methods.HttpPost
import org.apache.http.entity.mime.MultipartEntityBuilder
import org.apache.http.impl.client.HttpClients

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.apache.httpcomponents:httpmime:4.5.14'
    }
}

plugins {
    id 'java'
}

group = 'com.iqnox.twx.extensions'
defaultTasks 'clean', 'packageExtension'

// Keep the generated extension loadable on older ThingWorx versions, even when Gradle itself runs on a newer JDK.
tasks.withType(JavaCompile).configureEach {
    options.release = 11
}

// Define project properties in a structured way
ext {
    extensionJar = "ContentLoaderExtended_Extension.jar"
    baseDir = projectDir
    uiDir = "$baseDir/ui" // UI widgets folder
    localJarDir = "$baseDir/lib/local" // Local jars folder, packaged with the extension
    srcDir = "$baseDir/src/main" // Source directory
    configDir = "$baseDir/configfiles" // Config files folder, including any Entities
    zipDir = "$baseDir/zip" // Output zip folder
    thingworxSdkDir = "$baseDir/lib/twxSdk" // Thingworx SDK folder
    metadataXmlFile = "$configDir/metadata.xml"
    packageVendor = "IQNOX"
    packageName = "ContentLoaderExtension"
    packageTitle = "ContentLoaderExtension"
    // packageVersion will be read from metadata XML at initialization
    packageVersion = null
    thingworxServerRoot = "http://Administrator:Administrator12345@localhost:8015"
}

// Utility functions for XML metadata manipulation
def readMetadataXml() {
    File xmlFile = file(metadataXmlFile)
    if (!xmlFile.exists()) {
        throw new GradleException("Metadata XML file not found: ${xmlFile.absolutePath}")
    }
    def parser = new XmlParser(false, true)
    return parser.parse(xmlFile)
}

def writeMetadataXml(metadata, path) {
    File xmlFile = file(path)
    xmlFile.withPrintWriter { pw ->
        pw.write(XmlUtil.serialize(metadata))
    }
}

// Initialize metadata and version
ext.metadataXmlContents = readMetadataXml()
packageVersion = metadataXmlContents.ExtensionPackages.ExtensionPackage.@packageVersion[0]
version = packageVersion

// Exclude dependencies supplied by ThingWorx from the extension package.
// Bundling any of these can make the extension fail to import or run.
def shouldExcludeFile(String fileName) {
    def exclusions = [
            "commons-codec", "commons-io", "commons-lang", "commons-logging",
            "netty", "log4j", "logback", "httpclient", "httpcore", "httpmime",
            "slf4j", "thingworx", "json-"
    ]
    return exclusions.any { fileName.startsWith(it) }
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDir srcDir
        }
    }
}

clean.doFirst {
    delete zipDir
}

configurations {
    packageDependencies
    implementation {
        extendsFrom packageDependencies
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // The ThingWorx SDK jars, see the README for where to get them
    compileOnly fileTree(dir: thingworxSdkDir, include: ['*.jar'])
    // Jars in lib/local are bundled with the extension
    packageDependencies fileTree(dir: localJarDir, include: ['*.jar'])

    // Libraries that ThingWorx already provides at runtime. Only needed for compiling.
    compileOnly 'commons-io:commons-io:2.16.1'
    compileOnly 'org.apache.httpcomponents:httpclient:4.5.14'
    compileOnly 'org.apache.httpcomponents:httpmime:4.5.14'
    compileOnly 'org.json:json:20240303'
    compileOnly 'org.slf4j:slf4j-api:1.7.36'
    compileOnly 'ch.qos.logback:logback-classic:1.2.13'

    // Add all dependencies that must be bundled with the extension using the packageDependencies configuration.
}

jar {
    archiveFileName = extensionJar
    manifest {
        attributes(
                "Built-By": packageVendor,
                "Build-Date": new Date().format("yyyy-MM-dd HH:mm:ss"),
                "Package-Title": packageTitle,
                "Package-Version": packageVersion,
                "Package-Vendor": packageVendor
        )
    }
}

// Function to update metadata XML with jar dependencies
def addDependenciesInMetadata() {
    def metadata = metadataXmlContents
    def jarResources = metadata.ExtensionPackages.ExtensionPackage.JarResources[0]
    // Append extension jar reference
    jarResources.appendNode("FileResource", [type: "JAR", file: extensionJar])

    configurations.packageDependencies.files.each { File f ->
        if (!shouldExcludeFile(f.name)) {
            jarResources.appendNode("FileResource", [type: "JAR", file: f.name])
        }
    }

    writeMetadataXml(metadata, "${project.layout.buildDirectory.get()}/zip/metadata.xml")
}

tasks.register('prepPackage') {
    dependsOn jar
    doLast {
        delete zipDir
        delete "${layout.buildDirectory.get()}/zip/"

        // Copy the jars from packageDependencies
        copy {
            from configurations.packageDependencies {
                exclude { details -> shouldExcludeFile(details.file.name) }
            }
            into "${layout.buildDirectory.get()}/zip/lib/common/"
        }
        // Copy the configuration
        copy {
            from configDir
            into "${layout.buildDirectory.get()}/zip/"
        }

        addDependenciesInMetadata()
        // Copy the extension jar itself
        copy {
            from "${layout.buildDirectory.get()}/libs/${extensionJar}"
            into "${layout.buildDirectory.get()}/zip/lib/common/"
        }
        // Copy the UI files
        copy {
            from uiDir
            into "${layout.buildDirectory.get()}/zip/ui/"
        }
    }
}

tasks.register('packageExtension', Zip) {
    dependsOn tasks.prepPackage
    archiveFileName = "${project.name}-v${version}.zip"
    destinationDirectory = file(zipDir)
    from "${layout.buildDirectory.get()}/zip/"
}

// Explicitly update the version only when requested. This must not happen
// during Gradle's configuration phase, where even `gradlew tasks` could
// otherwise modify metadata.xml.
def increaseVersionNumber() {
    def currentVersion = version.toString()
    def versionComponents = currentVersion.split('\\.')
    def lastIndex = versionComponents.length - 1
    versionComponents[lastIndex] = (versionComponents[lastIndex].toInteger() + 1).toString()
    def newVersion = versionComponents.join('.')

    // Update metadata XML
    metadataXmlContents.ExtensionPackages.ExtensionPackage.@packageVersion = newVersion
    writeMetadataXml(metadataXmlContents, metadataXmlFile)

    logger.lifecycle("Updated version from ${currentVersion} to ${newVersion}")
    version = newVersion
}

tasks.register('incrementExtensionVersion') {
    group = 'build'
    description = 'Increments the patch version in configfiles/metadata.xml.'
    doLast {
        increaseVersionNumber()
    }
}

// Task to upload the packaged extension to Thingworx
tasks.register('upload') {
    dependsOn tasks.packageExtension
    doLast {
        def extZip = file("${zipDir}/${project.name}-v${version}.zip")
        def uploadUri = new URI("${thingworxServerRoot}/Thingworx/ExtensionPackageUploader?purpose=import")
        def request = new HttpPost(uploadUri)
        request.setHeader('X-XSRF-TOKEN', 'TWX-XSRF-TOKEN-VALUE')
        if (uploadUri.userInfo) {
            def credentials = Base64.encoder.encodeToString(uploadUri.userInfo.bytes)
            request.setHeader('Authorization', "Basic ${credentials}")
        }

        def entity = MultipartEntityBuilder.create().setLaxMode()
        entity.addBinaryBody('file', extZip)
        request.setEntity(entity.build())

        HttpClients.createDefault().withCloseable { client ->
            client.execute(request).withCloseable { response ->
                if (response.statusLine.statusCode in 200..<300) {
                    logger.lifecycle('Upload successful!')
                } else if (response.statusLine.statusCode == 406) {
                    logger.warn('Upload returned 406: Please restart ThingWorx for the changes to apply.')
                } else {
                    def responseBody = response.entity?.content?.text
                    logger.error("Upload failed: ${response.statusLine}, response: ${responseBody}")
                    throw new GradleException("ThingWorx upload failed, ${response.statusLine}! Response body: ${responseBody}. See server response above")
                }
            }
        }
    }
}
